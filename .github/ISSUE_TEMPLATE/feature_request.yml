name: Feature request
description: Propose a compatibility or workflow improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: need
    attributes:
      label: Use case
      description: What Eleven Rack workflow should this support?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Compatibility evidence
      description: Describe any clean-room observations or hardware tests.
