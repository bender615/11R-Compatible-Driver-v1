name: Bug report
description: Report a reproducible driver, audio, MIDI, or diagnostic problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not attach private presets, signing material, or vendor files.
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Mac model, macOS version, Xcode version, and Eleven Rack firmware
    validations:
      required: true
  - type: dropdown
    id: rate
    attributes:
      label: Sample rate
      options:
        - Not applicable
        - 44.1 kHz
        - 48 kHz
        - 88.2 kHz
        - 96 kHz
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove names, paths, certificates, identifiers, and private rig data.
      render: shell
