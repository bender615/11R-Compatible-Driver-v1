name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build diagnostic tools
        run: make -C Tools
      - name: Build app and DriverKit extension without signing
        run: >-
          xcodebuild
          -project ElevenRackDriver.xcodeproj
          -scheme 'ElevenRack (macOS)'
          -configuration Debug
          -derivedDataPath "$RUNNER_TEMP/ElevenRackDerivedData"
          CODE_SIGNING_ALLOWED=NO
          ONLY_ACTIVE_ARCH=NO
          build
